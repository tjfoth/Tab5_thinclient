; Standalone test: does the Tab5's USB-A port work as a high-speed USB device?
; Not part of the ThinClient firmware. Flashes only the app slot, so saved settings stay.
[platformio]
default_envs = usba_test

[env:usba_test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
board_build.partitions = ../../partitions.csv
lib_deps =
	m5stack/M5Unified
	m5stack/M5GFX
build_flags =
	-DBOARD_HAS_PSRAM
	; USB_MODE=0: Arduino's USB stack (TinyUSB) runs on the high-speed OTG controller, wired to USB-A.
	; USB-C stays on USB-Serial/JTAG, so esptool flashing over USB-C keeps working.
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=0
	-Wall

; Same test forced to full speed (12 Mbit/s), to tell a poor cable path from a firmware problem.
[env:usba_test_fs]
extends = env:usba_test
build_flags =
	${env:usba_test.build_flags}
	-DFORCE_FULL_SPEED=1

; High speed, with the UTMI (high-speed) PHY created before TinyUSB starts (Arduino only creates the FSLS one).
[env:usba_test_utmi]
extends = env:usba_test
build_flags =
	${env:usba_test.build_flags}
	-DUTMI_PHY_FIX=1

; High speed, with ESP-IDF's UTMI PHY hardware init run directly before USB starts (no usb_new_phy call).
[env:usba_test_utmi3]
extends = env:usba_test
build_flags =
	${env:usba_test.build_flags}
	-DUTMI_LL_INIT=1
